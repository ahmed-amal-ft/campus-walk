  on:{click:()=>{const de=document.documentElement;const order=[undefined,'light','dark'];const next=order[(order.indexOf(de.dataset.theme)+1)%3];if(next)de.dataset.theme=next;else delete de.dataset.theme;try{localStorage.setItem('q-theme',next||'');}catch(e){}}}});

function updateSteps(){const vis=visPages();stepsEl.innerHTML='';if(st.phase==='welcome'||st.phase==='end'){stepNo.textContent='';return;}

function heroArt(){
  const svg=document.createElementNS(MapLib.NS,'svg');svg.setAttribute('aria-hidden','true');
  if(MAP&&MAP.segments.length){const vb=MAP.viewBox;svg.setAttribute('viewBox',vb.join(' '));svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    const sw=vb[2]/230;MAP.segments.forEach(s=>MapLib.sv('path',{d:MapLib.pathD(s.pts),fill:'none',stroke:'var(--line)','stroke-width':sw,'stroke-linecap':'round','stroke-linejoin':'round'},svg));
    const ods=(MAP.places||[]).filter(p=>p.od&&p.node);const adj=MapLib.graph(MAP);let best=null;
    for(let i=0;i<Math.min(ods.length,14);i++)for(let j=i+1;j<Math.min(ods.length,14);j++){const r=MapLib.bfs(MAP,adj,ods[i].node,ods[j].node);if(r&&(!best||r.length>best.p.length))best={p:r,a:ods[i],b:ods[j]};}
    if(best){let pts=[];best.p.forEach(st=>{const o=MapLib.orient(st.seg,st.from);pts=pts.concat(pts.length?o.slice(1):o);});
      const len=MapLib.polyLen(pts);const path=MapLib.sv('path',{d:MapLib.pathD(pts),fill:'none',stroke:'var(--accent)','stroke-width':sw*1.9,'stroke-linecap':'round','stroke-linejoin':'round'},svg);
      if(!matchMedia('(prefers-reduced-motion: reduce)').matches){path.style.strokeDasharray=len;path.style.strokeDashoffset=len;path.style.transition='stroke-dashoffset 2.4s .4s ease';requestAnimationFrame(()=>requestAnimationFrame(()=>path.style.strokeDashoffset=0));}
      MapLib.sv('circle',{cx:pts[0][0],cy:pts[0][1],r:sw*3.2,fill:'#1E8A4C'},svg);MapLib.sv('circle',{cx:pts[pts.length-1][0],cy:pts[pts.length-1][1],r:sw*3.2,fill:'#C2253B'},svg);}
    return svg;}
  return null;}
function showWelcome(){st.phase='welcome';const art=heroArt();const c=S.consent||{};
  const chips=h('div',{class:'chips'},S.estMinutes?h('span',{class:'chip t',text:fmt(UI.minutes,{n:S.estMinutes})}):null,pages.filter(p=>p.title).slice(0,8).map(p=>h('span',{class:'chip',text:p.title})));
  const box=c.enabled?h('div',{class:'consent'},c.title?h('h3',{text:c.title}):null,h('div',{class:'txt',html:md(c.text)}),
    h('label',{class:'opt cb'},h('input',{type:'checkbox',on:{change:e=>{st.consent=e.target.checked;e.target.parentNode.classList.toggle('sel',st.consent);cmsg.textContent='';}}}),h('span',{class:'mark'}),h('span',{text:c.label||'I agree to take part'}))):null;
  const cmsg=h('span',{class:'msg',role:'alert'});
  const go=h('button',{type:'button',class:'btn primary big',on:{click:()=>{if(c.enabled&&!st.consent){cmsg.textContent=UI.consentError;return;}st.startedAt=Date.now();const f=step(-1,1);showPage(f<pages.length?f:0);}}},document.createTextNode(UI.start),h('svg',null));
  go.innerHTML=esc(UI.start)+'<svg class="flip" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const left=h('div',null,S.org?h('div',{class:'eyebrow',text:S.org}):null,h('h1',{text:S.title||'Questionnaire'}),S.subtitle?h('p',{class:'sub',text:S.subtitle}):null,
    S.intro?h('div',{class:'lead',style:{marginTop:'16px'},html:md(S.intro)}):null,chips,box,h('div',{class:'cta'},go,cmsg));
  const hero=h('div',{class:'page hero'+(art?' hasmap':'')},left,art?h('div',{class:'hero-art'},art):null);
  swap(banner(hero),false);}
function banner(node){const b=PREVIEW?UI.previewBanner:(!CONFIGURED?UI.testBanner:null);return b?h('div',null,h('div',{class:'banner',text:b}),node):node;}
function showPage(i){st.pi=i;st.phase='page';const p=pages[i];const vis=visPages();const pos=vis.indexOf(i)+1;
  const hook={f:null};const cards=p.questions.map(q=>makeQuestion(q,st.ans,(aq)=>{if(hook.f)hook.f();setTimeout(()=>{if(aq){if(aq.type==='text'||aq.type==='textarea')return;if(aq.type==='checkbox'){if(!aq.maxSelections)return;if((st.ans[aq.name]||[]).length<aq.maxSelections)return;}if(aq.type==='matrix'){if(Object.keys(st.ans[aq.name]||{}).length<(aq.rows||[]).length)return;}if(aq.type==='mappick'||aq.type==='landmarks'){const _mx=+aq.max||(aq.type==='mappick'?1:5);if((st.ans[aq.name]||[]).length<_mx)return;}}const _nxt=cards.find(cd=>!cd.el.hidden&&isEmpty(st.ans[cd.q.name])&&cd.q.type!=='info');if(_nxt&&(!aq||_nxt.q.id!==aq.id))_nxt.el.scrollIntoView({behavior:'smooth',block:'start'});},220);}));st.cards=cards;

  async function next(){const c=compute();let first=null;
    cards.forEach(cd=>{if(!c.qv[cd.q.id])return;const e=cd.validate();cd.setError(e);if(e&&!first)first=cd;});
    if(first){msg.textContent=first.validate();first.el.scrollIntoView({behavior:'smooth',block:'center'});return;}
    msg.textContent='';
    for(const cd of cards){if(!c.qv[cd.q.id])continue;const v=st.ans[cd.q.name];const list=optionsOf(cd.q);const so=(Array.isArray(v)?v:[v]).map(x=>list.find(o=>o.value===x)).find(o=>o&&o.endSurvey);if(so){showScreenOut();return;}}
    if(last){nextBtn.disabled=true;await submit(msg,nextBtn);}else showPage(step(i,1));}
  const node=h('div',{class:'page'},h('div',{class:'page-head'},h('div',{class:'eyebrow',text:fmt(UI.section,{n:pos,total:vis.length})}),h('h2',{text:p.title||''}),p.description?h('div',{class:'lead',html:md(p.description)}):null),
    h('div',{class:'qs'},cards.map(c=>c.el)),h('div',{class:'hp','aria-hidden':'true'},h('input',{type:'text',name:'website',id:'website',tabindex:'-1',autocomplete:'off'})),
    h('div',{class:'nav'},backBtn,msg,lock,nextBtn));

function buildPayload(){const c=compute();const answers={};

    lang:navigator.language,tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||''),screen:[screen.width,screen.height],viewport:[innerWidth,innerHeight],ua:navigator.userAgent.slice(0,160)},answers}};}
async function send(payload){
  if(!CONFIGURED)return{local:true};
  const hd={'Content-Type':'application/json',apikey:CFG.supabaseKey,Prefer:'return=minimal'};if(/^eyJ/.test(CFG.supabaseKey))hd.Authorization='Bearer '+CFG.supabaseKey;
  const r=await fetch(String(CFG.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/'+encodeURIComponent(S.table||'responses'),{method:'POST',headers:hd,body:JSON.stringify(payload)});
  if(!r.ok){let t='';try{t=await r.text();}catch(e){}throw new Error(r.status+' '+t.slice(0,240));}return{};}

    if(!msg.parentNode.querySelector('.dl')){const dl=h('button',{type:'button',class:'btn ghost dl',text:UI.download,on:{click:()=>downloadJSON(payload)}});msg.parentNode.insertBefore(dl,msg.nextSibling);}}}

     h('div',{class:'row',style:{marginTop:'8px'}},h('button',{type:'button',class:'btn',text:UI.copy,on:{click:e=>{const ta=document.getElementById('payload-dump');navigator.clipboard.writeText(ta.value).then(()=>e.target.textContent=UI.copied).catch(()=>{ta.focus();ta.select();});}}}),h('button',{type:'button',class:'btn',text:UI.download,on:{click:()=>downloadJSON(payload)}}))):null;
  const node=h('div',{class:'page center'},h('div',{class:'check',html:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}),h('h2',{style:{fontFamily:'var(--f-display)',fontSize:'2rem'},text:t.title||UI.thanksTitle}),h('div',{class:'lead',html:md(t.text||UI.thanksText)}),
    t.linkUrl?h('a',{class:'btn primary',href:t.linkUrl,target:'_blank',rel:'noopener noreferrer',text:t.linkLabel||t.linkUrl}):null,dump);
