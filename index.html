<style id="baseCss">
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}

input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}

.opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.opt .mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;transition:all .15s}
.opt.cb .mark{border-radius:6px}
.opt .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent);transform:scale(0);transition:transform .15s}
.opt.cb .mark::after{width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;border-radius:0;background:none;transform:rotate(45deg) scale(0) translateY(-1px)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent)}
.opt.sel .mark::after{transform:scale(1)}
.opt.cb.sel .mark::after{transform:rotate(45deg) scale(1) translateY(-1px)}
.pills .opt{border-radius:999px;padding:8px 16px}
.pills .mark{display:none}
.pills .opt.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale{display:grid;gap:5px}
.scale.many{grid-template-columns:repeat(auto-fit,minmax(44px,1fr))}

.sbtn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.sbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sbtn b{font-family:var(--f-mono);font-size:14px;font-weight:500}
.pips{display:flex;gap:2px;align-items:flex-end;height:14px}

.pips i.on{opacity:1}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:12px}
.na{align-self:flex-start;background:none;border:1.5px dashed var(--line);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted);cursor:pointer}
.na[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent)}
.mx{display:flex;flex-direction:column}
.mx-head,.mx-row{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(var(--n),minmax(0,1fr));gap:4px 6px;align-items:center}
.mx-head{padding-bottom:8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.mx-row{padding:8px 0;border-bottom:1px solid var(--line)}
.mx-row:last-child{border-bottom:0}
.mx-row.bad{background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:8px}
.mx-lab{font-size:.95rem;font-weight:500;padding-inline-end:8px}
.mx-cell{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--muted);border-radius:8px}
.mx-cell:hover .dot{border-color:var(--accent)}
.mx-cell .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:block;transition:all .15s}
.mx-cell[aria-checked="true"] .dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.mx-cell[aria-checked="true"]{color:var(--ink)}
.mx-cell .cl{display:none;font-size:11px;line-height:1.15;text-align:center}
@media (max-width:640px){
 .mx-head{display:none}
 .mx-row{grid-template-columns:repeat(var(--n),minmax(0,1fr));padding:12px 0}
 .mx.many .mx-row{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
 .mx-lab{grid-column:1/-1;padding-bottom:2px}
 .mx-cell .cl{display:block}
}
.stars{display:flex;gap:4px}
.star{background:none;border:0;padding:2px;cursor:pointer;color:var(--line)}

.star.on{color:var(--accent)}
.sl-wrap{display:flex;flex-direction:column;gap:8px}
.sl-val{font-family:var(--f-mono);font-size:1.4rem;color:var(--accent);min-height:1.8rem}
.sl-val.empty{color:var(--muted);font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.rank{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.rank li{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.rank .n{font-family:var(--f-mono);color:var(--accent);width:1.4em}
.rank .lbl{flex:1}
.rank button{border:1px solid var(--line);background:none;border-radius:6px;width:30px;height:30px;cursor:pointer}

.btn{font-weight:500;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:13px 26px;font-size:1.02rem}
[dir=rtl] .flip{transform:scaleX(-1)}
.nav{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:12px;background:linear-gradient(to top,var(--bg) 62%,transparent)}
.nav .msg{color:var(--bad);font-size:.9rem;flex:1;text-align:center}
.hero{display:grid;gap:28px;align-items:center}
@media (min-width:860px){.hero.hasmap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}

.hero-art svg{width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.chip.t{font-family:var(--f-mono);background:none;border-color:var(--line);color:var(--muted)}
.consent{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.consent h3{font-family:var(--f-display);font-size:1.05rem}
.consent .txt{font-size:.93rem;color:var(--muted);max-height:220px;overflow:auto}
.cta{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cta .msg{color:var(--bad);font-size:.9rem}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 0}
.check{width:72px;height:72px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.check svg{width:38px;height:38px;stroke:var(--on-accent);fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.banner{font-size:.88rem;padding:9px 14px;border-radius:10px;background:color-mix(in srgb,var(--warn) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));margin-bottom:14px}
.dump{width:100%;min-height:200px;font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.foot{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 36px max(16px,env(safe-area-inset-right,0px));font-size:.85rem;color:var(--muted);text-align:center}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.poi.picked circle,.lm.picked polygon{fill:var(--m-origin);stroke:var(--m-origin)}
.lmpick .pl text{pointer-events:all}
.lmpick .mapwrap{margin-bottom:12px}
/* map task */
.mt-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mt-grid{grid-template-columns:minmax(0,1fr)}}
.mapwrap{background:var(--m-mapbg);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0;position:relative;direction:ltr}
.mapwrap svg{display:block;width:100%;height:auto;max-height:78vh;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
@media (min-width:901px){.mt-grid>div:first-child{position:sticky;top:64px}.mt .mapwrap svg{height:clamp(360px,calc(100vh - 190px),820px);max-height:none}}
.mapwrap.zoomed svg{cursor:grab}.mapwrap.zoomed svg:active{cursor:grabbing}
.mapwrap svg:focus{outline:none}
.mapwrap svg:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mhint{position:absolute;inset:8px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:rgba(10,16,13,.62);color:#fff;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.mhint.on{opacity:1}
.mnav{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.pan{position:absolute;bottom:14px;inset-inline-end:14px;display:none;grid-template-columns:repeat(3,30px);gap:3px}
.mapwrap.zoomed .pan{display:grid}

.lmtag text{font:700 12px var(--f-body);paint-order:stroke;stroke:var(--m-mapbg);stroke-width:4px;fill:var(--m-ink)}
.lmtag circle{fill:var(--accent);stroke:#fff;stroke-width:2}
.lmtag .n{fill:#fff;stroke:none;font-size:11px}
.lmnum{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;margin-inline-end:8px;flex:none}
.nav .lock{color:var(--muted);font-size:.88rem;flex:1;text-align:center}
.zoom{position:absolute;top:14px;inset-inline-start:14px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 8px 2px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:4px;border-radius:2px;display:inline-block}
.sw.dot{width:10px;height:10px;border-radius:50%}
.mt-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mt-panel h3{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.2;text-wrap:balance}
.hint{font-size:13.5px;color:var(--muted)}

.mt-progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}

.od{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}

.chiplist{display:flex;flex-wrap:wrap;gap:6px}

.item{display:flex;flex-direction:column;gap:7px;padding-block:10px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.overall{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:12px;padding:12px;margin-top:6px}

.trip{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;font-size:14px}

.mt-msg{font-size:13.5px;color:var(--bad);min-height:1.2em}
/* route numbers and arrows must not swallow taps meant for the path under them */
.mapwrap .num,.mapwrap #m-gArrow,.mapwrap .lmtags{pointer-events:none}
.mapwrap .poi.o,.mapwrap .poi.d{cursor:pointer}

        h('div',null,items.map(it=>{const labs=it.labels||[];const vals=labs.map((_,i)=>i+1);

            scaleRow(vals.length?vals:[1,2,3,4,5],labs,r[it.key],v=>{M.ratings[cur.id]=M.ratings[cur.id]||{};M.ratings[cur.id][it.key]=v;push();render();}));})),
        h('div',{class:'row'},h('button',{type:'button',class:'btn',text:T.map_prev,on:{click:()=>{if(M.r)M.r--;else{M.phase=detQs.length?'details':'route';detCards=null;}render();}}}),
          h('button',{type:'button',class:'btn primary',disabled:!complete,text:complete?(M.r<us.length-1?T.map_nextPath:(M.t<M.trips.length-1?T.map_nextWalk:T.map_finish)):fmt(T.map_answerAll,{n:items.length,k:doneN}),on:{click:()=>{if(M.r<us.length-1){M.r++;push();render();}else{push();nextTrip();}}}})));}
    else{const us=uniqueSegs();
      panel.append(h('div',{class:'eyebrow',text:'✓'}),h('h3',{text:T.map_doneTitle}),
        h('div',{class:'dform'},M.trips.map((t,i)=>h('div',{class:'trip'},h('i',{class:'sw',style:{background:tc(i)}}),h('div',null,h('strong',{text:t.label}),h('br'),t.skipped?h('span',{class:'hint',text:T.map_noWalk}):document.createTextNode(nm(t.origin)+' → '+nm(t.dest)+' · '+t.path.length+' '+T.map_paths))))),
        h('p',{class:'hint',text:fmt(T.map_ratedN,{n:us.length})}),
        h('div',{class:'row'},h('button',{type:'button',class:'btn',text:T.map_again,on:{click:()=>{M=fresh();detCards=null;delete store[q.name];changed();render();}}})));}
    panel.append(msg);}

  return{el:wrap,validate:()=>M.phase==='done'?null:(q.required!==false?T.map_unfinished:null),incomplete:()=>M.phase!=='done'};
}

/* ---------- screens ---------- */
const stage=h('main',{class:'stage',id:'stage'});
const stepsEl=h('div',{class:'steps','aria-hidden':'true'});
const stepNo=h('span',{class:'stepno'});
const themeBtn=h('button',{type:'button',class:'iconbtn','aria-label':UI.theme,title:UI.theme,html:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  on:{click:()=>{const de=document.documentElement;const order=[undefined,'light','dark'];const next=order[(order.indexOf(de.dataset.theme)+1)%3];if(next)de.dataset.theme=next;else delete de.dataset.theme;try{localStorage.setItem('q-theme',next||'');}catch(e){}}}});
const footEl=h('footer',{class:'foot'});
function updateSteps(){const vis=visPages();stepsEl.innerHTML='';if(st.phase==='welcome'||st.phase==='end'){stepNo.textContent='';return;}
  const pos=vis.indexOf(st.pi);vis.forEach((p,i)=>stepsEl.append(h('i',{class:i<pos?'done':(i===pos?'cur':'')})));stepNo.textContent=pos>=0?(pos+1)+'/'+vis.length:'';}
function swap(node,wide){stage.innerHTML='';stage.classList.toggle('wide',!!wide);stage.append(node);window.scrollTo({top:0});updateSteps();}
function heroArt(){
  const svg=document.createElementNS(MapLib.NS,'svg');svg.setAttribute('aria-hidden','true');
  if(MAP&&MAP.segments.length){const vb=MAP.viewBox;svg.setAttribute('viewBox',vb.join(' '));svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    const sw=vb[2]/230;MAP.segments.forEach(s=>MapLib.sv('path',{d:MapLib.pathD(s.pts),fill:'none',stroke:'var(--line)','stroke-width':sw,'stroke-linecap':'round','stroke-linejoin':'round'},svg));
    const ods=(MAP.places||[]).filter(p=>p.od&&p.node);const adj=MapLib.graph(MAP);let best=null;
    for(let i=0;i<Math.min(ods.length,14);i++)for(let j=i+1;j<Math.min(ods.length,14);j++){const r=MapLib.bfs(MAP,adj,ods[i].node,ods[j].node);if(r&&(!best||r.length>best.p.length))best={p:r,a:ods[i],b:ods[j]};}
    if(best){let pts=[];best.p.forEach(st=>{const o=MapLib.orient(st.seg,st.from);pts=pts.concat(pts.length?o.slice(1):o);});
      const len=MapLib.polyLen(pts);const path=MapLib.sv('path',{d:MapLib.pathD(pts),fill:'none',stroke:'var(--accent)','stroke-width':sw*1.9,'stroke-linecap':'round','stroke-linejoin':'round'},svg);
      if(!matchMedia('(prefers-reduced-motion: reduce)').matches){path.style.strokeDasharray=len;path.style.strokeDashoffset=len;path.style.transition='stroke-dashoffset 2.4s .4s ease';requestAnimationFrame(()=>requestAnimationFrame(()=>path.style.strokeDashoffset=0));}
      MapLib.sv('circle',{cx:pts[0][0],cy:pts[0][1],r:sw*3.2,fill:'#1E8A4C'},svg);MapLib.sv('circle',{cx:pts[pts.length-1][0],cy:pts[pts.length-1][1],r:sw*3.2,fill:'#C2253B'},svg);}
    return svg;}
  return null;}
function showWelcome(){st.phase='welcome';const art=heroArt();const c=S.consent||{};
  const chips=h('div',{class:'chips'},S.estMinutes?h('span',{class:'chip t',text:fmt(UI.minutes,{n:S.estMinutes})}):null,pages.filter(p=>p.title).slice(0,8).map(p=>h('span',{class:'chip',text:p.title})));
  const box=c.enabled?h('div',{class:'consent'},c.title?h('h3',{text:c.title}):null,h('div',{class:'txt',html:md(c.text)}),
    h('label',{class:'opt cb'},h('input',{type:'checkbox',on:{change:e=>{st.consent=e.target.checked;e.target.parentNode.classList.toggle('sel',st.consent);cmsg.textContent='';}}}),h('span',{class:'mark'}),h('span',{text:c.label||'I agree to take part'}))):null;
  const cmsg=h('span',{class:'msg',role:'alert'});
  const go=h('button',{type:'button',class:'btn primary big',on:{click:()=>{if(c.enabled&&!st.consent){cmsg.textContent=UI.consentError;return;}st.startedAt=Date.now();const f=step(-1,1);showPage(f<pages.length?f:0);}}},document.createTextNode(UI.start),h('svg',null));
  go.innerHTML=esc(UI.start)+'<svg class="flip" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const left=h('div',null,S.org?h('div',{class:'eyebrow',text:S.org}):null,h('h1',{text:S.title||'Questionnaire'}),S.subtitle?h('p',{class:'sub',text:S.subtitle}):null,
    S.intro?h('div',{class:'lead',style:{marginTop:'16px'},html:md(S.intro)}):null,chips,box,h('div',{class:'cta'},go,cmsg));
  const hero=h('div',{class:'page hero'+(art?' hasmap':'')},left,art?h('div',{class:'hero-art'},art):null);
  swap(banner(hero),false);}
function banner(node){const b=PREVIEW?UI.previewBanner:(!CONFIGURED?UI.testBanner:null);return b?h('div',null,h('div',{class:'banner',text:b}),node):node;}
function showPage(i){st.pi=i;st.phase='page';const p=pages[i];const vis=visPages();const pos=vis.indexOf(i)+1;
  const hook={f:null};const cards=p.questions.map(q=>makeQuestion(q,st.ans,()=>{if(hook.f)hook.f();}));st.cards=cards;
  const lock=h('span',{class:'lock'});
  const refresh=()=>{const c=compute();cards.forEach(cd=>{cd.el.hidden=!c.qv[cd.q.id];});updateSteps();
    const blocked=cards.some(cd=>c.qv[cd.q.id]&&cd.blocking());nextBtn.disabled=blocked;lock.textContent=blocked?UI.map_lockNext:'';lock.hidden=!blocked;msg.hidden=blocked;};
  const msg=h('div',{class:'msg',role:'alert'});
  const last=step(i,1)>=pages.length;
  const nextBtn=h('button',{type:'button',class:'btn primary big',on:{click:()=>next()}});
  nextBtn.innerHTML=esc(last?UI.submit:UI.next)+'<svg class="flip" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const prev=step(i,-1);
  const backBtn=prev>=0?h('button',{type:'button',class:'btn ghost',text:UI.back,on:{click:()=>showPage(prev)}}):h('span');
  async function next(){const c=compute();let first=null;
    cards.forEach(cd=>{if(!c.qv[cd.q.id])return;const e=cd.validate();cd.setError(e);if(e&&!first)first=cd;});
    if(first){msg.textContent=first.validate();first.el.scrollIntoView({behavior:'smooth',block:'center'});return;}
    msg.textContent='';
    for(const cd of cards){if(!c.qv[cd.q.id])continue;const v=st.ans[cd.q.name];const list=optionsOf(cd.q);const so=(Array.isArray(v)?v:[v]).map(x=>list.find(o=>o.value===x)).find(o=>o&&o.endSurvey);if(so){showScreenOut();return;}}
    if(last){nextBtn.disabled=true;await submit(msg,nextBtn);}else showPage(step(i,1));}
  const node=h('div',{class:'page'},h('div',{class:'page-head'},h('div',{class:'eyebrow',text:fmt(UI.section,{n:pos,total:vis.length})}),h('h2',{text:p.title||''}),p.description?h('div',{class:'lead',html:md(p.description)}):null),
    h('div',{class:'qs'},cards.map(c=>c.el)),h('div',{class:'hp','aria-hidden':'true'},h('input',{type:'text',name:'website',id:'website',tabindex:'-1',autocomplete:'off'})),
    h('div',{class:'nav'},backBtn,msg,lock,nextBtn));
  swap(banner(node),p.questions.some(q=>q.type==='map'));hook.f=refresh;refresh();}
function buildPayload(){const c=compute();const answers={};
  pages.forEach(p=>p.questions.forEach(q=>{if(q.type==='info'||!q.name||!c.qv[q.id])return;const v=st.ans[q.name];if(v===undefined||v===null)return;answers[q.name]=v;if(st.ans[q.name+'__other']!==undefined)answers[q.name+'__other']=st.ans[q.name+'__other'];}));
  const now=Date.now();
  return{questionnaire_version:String(Q.version||'v1'),data:{meta:{pid:st.pid,started_at:st.startedAt?new Date(st.startedAt).toISOString():null,submitted_at:new Date(now).toISOString(),duration_s:st.startedAt?Math.round((now-st.startedAt)/1000):null,
    lang:navigator.language,tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||''),screen:[screen.width,screen.height],viewport:[innerWidth,innerHeight],ua:navigator.userAgent.slice(0,160)},answers}};}
async function send(payload){
  if(!CONFIGURED)return{local:true};
  const hd={'Content-Type':'application/json',apikey:CFG.supabaseKey,Prefer:'return=minimal'};if(/^eyJ/.test(CFG.supabaseKey))hd.Authorization='Bearer '+CFG.supabaseKey;
  const r=await fetch(String(CFG.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/'+encodeURIComponent(S.table||'responses'),{method:'POST',headers:hd,body:JSON.stringify(payload)});
  if(!r.ok){let t='';try{t=await r.text();}catch(e){}throw new Error(r.status+' '+t.slice(0,240));}return{};}
async function submit(msg,btn){const payload=buildPayload();
  const hp=document.getElementById('website');if(hp&&hp.value){showEnd(payload,{local:true,spam:true});return;}
  btn.disabled=true;const old=btn.innerHTML;btn.textContent=UI.sending;
  try{const r=await send(payload);showEnd(payload,r);}
  catch(e){btn.disabled=false;btn.innerHTML=old;msg.textContent=UI.sendError;console.error(e);
    if(!msg.parentNode.querySelector('.dl')){const dl=h('button',{type:'button',class:'btn ghost dl',text:UI.download,on:{click:()=>downloadJSON(payload)}});msg.parentNode.insertBefore(dl,msg.nextSibling);}}}
function downloadJSON(payload){try{const b=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});const a=h('a',{href:URL.createObjectURL(b),download:'my-answers.json'});document.body.append(a);a.click();a.remove();}catch(e){}}
function showEnd(payload,r){st.phase='end';const t=S.thanks||{};
  const dump=r.local&&!r.spam?h('div',{style:{width:'100%',textAlign:'start'}},h('p',{class:'hint',text:PREVIEW?UI.previewBanner:UI.testBanner}),h('textarea',{class:'dump',readonly:true,value:JSON.stringify(payload,null,1),id:'payload-dump'}),
     h('div',{class:'row',style:{marginTop:'8px'}},h('button',{type:'button',class:'btn',text:UI.copy,on:{click:e=>{const ta=document.getElementById('payload-dump');navigator.clipboard.writeText(ta.value).then(()=>e.target.textContent=UI.copied).catch(()=>{ta.focus();ta.select();});}}}),h('button',{type:'button',class:'btn',text:UI.download,on:{click:()=>downloadJSON(payload)}}))):null;
  const node=h('div',{class:'page center'},h('div',{class:'check',html:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}),h('h2',{style:{fontFamily:'var(--f-display)',fontSize:'2rem'},text:t.title||UI.thanksTitle}),h('div',{class:'lead',html:md(t.text||UI.thanksText)}),
    t.linkUrl?h('a',{class:'btn primary',href:t.linkUrl,target:'_blank',rel:'noopener noreferrer',text:t.linkLabel||t.linkUrl}):null,dump);
  swap(node,false);window.onbeforeunload=null;window.__SUBMITTED=payload;}
function showScreenOut(){st.phase='end';const t=S.screenOut||{};window.onbeforeunload=null;
  swap(h('div',{class:'page center'},h('h2',{style:{fontFamily:'var(--f-display)',fontSize:'1.8rem'},text:t.title||UI.screenOutTitle}),h('div',{class:'lead',html:md(t.text||UI.screenOutText)})),false);window.__SCREENED_OUT=true;}

/* ---------- boot ---------- */
applyTheme();
app.append(h('header',{class:'top'},h('div',{class:'top-in'},h('div',{class:'brand',text:S.org||S.title||''}),stepsEl,stepNo,themeBtn)),stage,footEl);
if(S.contact)footEl.innerHTML=md(S.contact);
window.onbeforeunload=e=>{if(!PREVIEW&&st.phase==='page'&&Object.keys(st.ans).length){e.preventDefault();e.returnValue=UI.leave;return UI.leave;}};
window.__SURVEY={st,buildPayload,compute};
if(PREVIEW&&window.PREVIEW_PAGE!=null&&pages[window.PREVIEW_PAGE]){st.startedAt=Date.now();showPage(window.PREVIEW_PAGE);}else showWelcome();
})();
