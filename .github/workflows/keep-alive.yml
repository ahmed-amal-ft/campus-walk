name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (08:17 Cairo)
  workflow_dispatch:        # allows running it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_KEY repository secrets first."; exit 1
          fi
          response=$(curl -sS --fail-with-body -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase replied: $response"
